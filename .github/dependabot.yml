version: 2
updates:
  - package-ecosystem: npm
    directory: /Antigravity-Claude-Code-Proxy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Node's types follow the lowest supported runtime (engines.node >=22.13), not the newest Node
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /Antigravity-Claude-Code-Proxy
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: docker
